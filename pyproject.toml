[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news-recommendation-mlops"
version = "0.1.0"
description = "Production-style news recommendation MLOps platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "opensearch-py>=2.6.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "qdrant-client>=1.12.0",
    "sentence-transformers>=3.0.0",
    # evidently still imports names removed in pandas 3
    "pandas>=2.2.0,<3",
    "pyarrow>=16.0.0",
    "lightgbm>=4.5.0",
    "scikit-learn>=1.5.0",
    "mlflow>=2.14.0",
    "prometheus-client>=0.20.0",
    "redis>=5.0.0",
    "evidently>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pyyaml>=6.0.0",
    "pandas-stubs>=2.2.0,<3",
]
# NOTE: Airflow is intentionally NOT an extra of this package. Airflow pins
# SQLAlchemy 1.4 while the app requires SQLAlchemy 2.x, so Airflow lives in its
# own environment (see airflow/requirements.txt), exactly as it does in
# production where the scheduler runs separately from the API.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app", "pipelines"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "evidently.*"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["app*", "pipelines*", "scripts*"]
exclude = [
    "airflow*",
    "data*",
    "docker*",
    "k8s*",
    "monitoring*",
    "notebooks*",
    "reports*",
    "tests*",
]
