apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: news-rec
  labels:
    app: redis
    app.kubernetes.io/part-of: news-rec
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: news-rec
  labels:
    app: redis
    app.kubernetes.io/part-of: news-rec
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
