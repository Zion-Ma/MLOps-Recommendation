apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: news-rec
  labels:
    app: qdrant
    app.kubernetes.io/part-of: news-rec
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.12.0
          ports:
            - containerPort: 6333
              name: http
          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant/storage
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: qdrant-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: news-rec
  labels:
    app: qdrant
    app.kubernetes.io/part-of: news-rec
spec:
  selector:
    app: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: http
