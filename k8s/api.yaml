apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: news-rec
  labels:
    app: api
    app.kubernetes.io/part-of: news-rec
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: ghcr.io/zion-ma/mlops-recommendation:latest
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: news-rec-config
            - secretRef:
                name: news-rec-secrets
          volumeMounts:
            - name: news-rec-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: news-rec-data
          persistentVolumeClaim:
            claimName: news-rec-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: news-rec
  labels:
    app: api
    app.kubernetes.io/part-of: news-rec
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: news-rec
  labels:
    app: api
    app.kubernetes.io/part-of: news-rec
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
