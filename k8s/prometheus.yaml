apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: news-rec
  labels:
    app: prometheus
    app.kubernetes.io/part-of: news-rec
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: news-rec-api
        metrics_path: /metrics
        # Scrape every API pod directly so per-pod latency is visible.
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [news-rec]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_ip]
            action: replace
            regex: (\d+);(.+)
            replacement: $2:$1
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: news-rec
  labels:
    app: prometheus
    app.kubernetes.io/part-of: news-rec
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: news-rec
  labels:
    app: prometheus
    app.kubernetes.io/part-of: news-rec
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: news-rec
  labels:
    app: prometheus
    app.kubernetes.io/part-of: news-rec
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: news-rec
roleRef:
  kind: Role
  name: prometheus
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: news-rec
  labels:
    app: prometheus
    app.kubernetes.io/part-of: news-rec
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=15d
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: news-rec
  labels:
    app: prometheus
    app.kubernetes.io/part-of: news-rec
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
